# action 版本漂移是这个仓库唯一只能靠人盯 CI 日志发现的问题（2026-10 的 Node 20 弃用
# 警告就是 actions/checkout@v4 等三个 action 带 node20 运行时造成的）。这里只覆盖
# github-actions 生态，npm / pnpm 依赖更新另议；按周检查，避免给自己刷 PR 噪音。
version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
