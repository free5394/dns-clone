# ci.yml — 每次 push 到 main 与每个 PR 上跑类型检查与测试
# 仓库此前没有任何 guardrail：pnpm typecheck / pnpm test 都能跑通，但没有机制保证被跑。
# 本 workflow 只做两件事，全部依赖已在 devDependencies 内，不额外引入新依赖。
name: CI

on:
    push:
        branches: [main]
    pull_request:

# 同一分支的旧运行自动取消，避免 push 频繁时排队堆积
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # 三个 uses 步骤均固定在其 node24 运行时的大版本：停在 v4 会触发 GitHub 的
            # "Node.js 20 is deprecated" 警告（v4 自带 node20，被强制跑在 node24 上）。
            - uses: actions/checkout@v7

            # pnpm 版本取自 package.json 的 packageManager 字段，不在此处重复声明
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            # worker-configuration.d.ts 在 .gitignore 内，检出后不存在，
            # 缺了它 D1Database / Env 等运行时类型全部丢失，tsc 会报 Cannot find name。
            # 必须先由 wrangler 生成，约 2 秒，不需要任何凭据。
            - name: 生成运行时类型
              run: pnpm cf-typegen

            # tsc --noEmit，约 0.3 秒
            - name: 类型检查
              run: pnpm typecheck

            # oxlint（Rust 实现），约 0.4 秒
            # 用 oxlint 而非 ESLint：本项目 TS 7 是 Go 原生端口，不暴露 JS 编译器 API，
            # typescript-eslint 在模块加载时直接抛错退出，无法使用。
            - name: 静态检查
              run: pnpm lint

            # prettier --check，约 1 秒
            - name: 格式检查
              run: pnpm format:check

            # vitest run --coverage，比 pnpm test 多约 4 秒（istanbul 插桩），换来 coverage 路径进 CI。
            # 这条命令曾在 .gitignore / 依赖版本错配下静默坏过（@vitest/coverage-istanbul 5.0.5 vs vitest 4.1.11），
            # 现在由 CI 每次跑，坏了就红。
            # 测试数据全部由 test/apply-migrations.ts 写入固定占位值，不依赖任何 secret
            - name: 测试
              run: pnpm test:coverage
