#:schema node_modules/wrangler/config-schema.json
# dns-clone 部署配置示例（复制后按注释填写）
#
# 用法：把 database_id 换成你自己的 D1 ID、name 换成你自己的 Worker 名再部署；
#      也可以用 `wrangler deploy --config <本文件路径>` 指定（相对路径按本文件所在目录解析）。
# 仓库提交态的 wrangler.toml 与本文件字段相同：name 用占位名、database_id 保留哨兵值
# REPLACE_WITH_YOUR_D1_ID —— 原因与线上部署方式见 docs/deployment.md。
# 真实 database_id、API Token、账号邮箱一律不要提交。

# Worker 名称。本示例故意用占位名，复制后换成你自己的，
# 避免误把本地配置发布到别人的（或生产）Worker 上。
name = "your-worker-name"
# 入口与源码目录，路径相对本配置文件所在目录解析
main = "src/index.ts"
compatibility_date = "2026-05-20"

# 保留 Dashboard 手动配置的 Variables / Bindings，CLI 部署不覆盖
keep_vars = true

# Workers 观测能力（Tail Logs / Analytics）
[observability]
enabled = true

# 每半小时触发一次 scheduled handler（Cron 表达式按 UTC 解释）
[triggers]
crons = ["0,30 * * * *"]

# 唯一 D1 绑定：env.WUYA。代码与控制台配置都依赖这个绑定名，不要改名
[[d1_databases]]
binding = "WUYA"
# 改成你自己创建的 D1 库名
database_name = "wuya-db"
# 哨兵值：未替换时 scripts/predeploy.cjs 会拦截部署
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "src/db/migrations"
